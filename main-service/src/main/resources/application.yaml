
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ewm
    username: user
    password: ewm
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

stats:
  server:
    base-url: http://localhost:9090
    connect-timeout: 2s
    read-timeout: 5s
